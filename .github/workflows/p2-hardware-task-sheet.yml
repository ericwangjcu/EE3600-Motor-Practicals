name: Build hardware-updated Practical 2 task sheet
on:
  push:
    branches: [p2-task-sheet-hardware-connections]
    paths:
      - 'docs/EE3600_Practical_2_Task_Sheet_Hardware_Updated.tex'
      - '.github/workflows/p2-hardware-task-sheet.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install PDF build and inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended poppler-utils python3-venv
          python3 -m venv /tmp/p2-pdf-env
          /tmp/p2-pdf-env/bin/pip -q install pymupdf
      - name: Typeset task sheet twice
        working-directory: docs
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error EE3600_Practical_2_Task_Sheet_Hardware_Updated.tex > /tmp/p2-pass-1.log
          pdflatex -interaction=nonstopmode -halt-on-error EE3600_Practical_2_Task_Sheet_Hardware_Updated.tex > /tmp/p2-pass-2.log
          pdfinfo EE3600_Practical_2_Task_Sheet_Hardware_Updated.pdf
          grep -E 'Overfull|Warning' /tmp/p2-pass-2.log || true
      - name: Inspect all pages, equations and hardware content
        run: |
          /tmp/p2-pdf-env/bin/python - <<'PY'
          from pathlib import Path
          import fitz, json, hashlib, re
          file=Path('docs/EE3600_Practical_2_Task_Sheet_Hardware_Updated.pdf')
          proof=Path('docs/p2-hardware-task-proof'); proof.mkdir(exist_ok=True)
          doc=fitz.open(file)
          headings=['1. Carry forward','2. Analyse and simulate','3. Add I and tune','4. Speed requirements','5A. Hardware connections','5B. Load P2 firmware','5C. Website and Pico','6. Results and submission']
          report={'pages':len(doc),'source_revision':'coordinator formatted six-page task sheet plus hardware handover','sha256':hashlib.sha256(file.read_bytes()).hexdigest(),'page_checks':[],'hardware_tested':False}
          all_text=''
          for i,page in enumerate(doc):
              text=page.get_text();all_text+=text+'\n'
              page.get_pixmap(matrix=fitz.Matrix(1.35,1.35),alpha=False).save(proof/f'page-{i+1}.png')
              off=[]
              for block in page.get_text('dict')['blocks']:
                  for line in block.get('lines',[]):
                      for span in line['spans']:
                          x0,y0,x1,y1=span['bbox']
                          if x0<47 or x1>page.rect.width-47 or y0<12 or y1>page.rect.height-13:off.append({'text':span['text'],'bbox':span['bbox']})
              report['page_checks'].append({'page':i+1,'expected_heading_present':i<len(headings) and headings[i] in text,'out_of_bounds':off,'characters':len(text)})
          (proof/'text.txt').write_text(all_text)
          report['initial_gain_guidance_retained']=all(x in all_text for x in ['0.00008396','0.255','0.0003292','Choose an initial P gain','Choose an initial I gain'])
          report['hardware_terms_present']=all(x in all_text for x in ['GP26','GP27','Yellow','Green','Blue','Black','Motor 1','BOOTSEL','RPI-RP2','DISARMED','6 V','Pico USB','3V3'])
          log=Path('/tmp/p2-pass-2.log').read_text()
          report['overfull_boxes']=re.findall(r'Overfull[^\n]*',log)
          (proof/'pdf-checks.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          assert len(doc)==8,'Unexpected page count; inspect before release'
          assert all(x['expected_heading_present'] for x in report['page_checks']),'Page break mismatch'
          assert all(not x['out_of_bounds'] for x in report['page_checks']),'Content outside margins'
          assert not report['overfull_boxes'],'Typesetting overflow'
          assert report['initial_gain_guidance_retained'] and report['hardware_terms_present']
          PY
      - name: Preserve tested PDF and evidence on document branch
        run: |
          git diff --check
          git diff --exit-code 33369eb67686f62f5056e90f2dddc371987705fa -- firmware practical2-control.html js index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/EE3600_Practical_2_Task_Sheet_Hardware_Updated.pdf docs/p2-hardware-task-proof
          if ! git diff --cached --quiet; then
            git commit -m 'Add checked eight-page Practical 2 PDF with wiring and startup instructions'
            git push origin HEAD:p2-task-sheet-hardware-connections
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Practical-2-task-sheet-with-hardware-connections
          path: |
            docs/EE3600_Practical_2_Task_Sheet_Hardware_Updated.pdf
            docs/EE3600_Practical_2_Task_Sheet_Hardware_Updated.tex
            docs/p2-hardware-task-proof/
            /tmp/p2-pass-1.log
            /tmp/p2-pass-2.log
          if-no-files-found: warn
